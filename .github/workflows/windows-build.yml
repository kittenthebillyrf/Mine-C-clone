name: Windows x64 build
on:
  push:
    branches: [ main, switch-port ]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: windows-x64-main-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        id: tests
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package executable
        if: always() && steps.Build.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/MineCppClone.exe dist/
      - name: Commit executable to main
        if: always() && steps.Build.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item build/Release/MineCppClone.exe MineCppClone.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MineCppClone.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Add Windows executable [skip ci]"
            git push origin HEAD:main
          }
      - name: Upload executable
        if: always() && steps.Build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MineCppClone-Windows-x64
          path: dist/MineCppClone.exe
          if-no-files-found: error
      - name: Report test status
        if: always() && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Windows executable was built and uploaded, but one or more tests failed."
          exit 1
